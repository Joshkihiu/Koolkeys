import java.util.Properties

plugins {
    id "com.android.application"
}

def signingPropertiesFile = rootProject.file("signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace "com.koolkeys.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.koolkeys.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    if (signingPropertiesFile.exists()) {
        signingConfigs {
            release {
                storeFile rootProject.file(signingProperties.getProperty("storeFile"))
                storePassword signingProperties.getProperty("storePassword")
                keyAlias signingProperties.getProperty("keyAlias")
                keyPassword signingProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.8.7"
    implementation "io.github.hijamoya:keyboardview:0.0.2"
    testImplementation "junit:junit:4.13.2"
}
